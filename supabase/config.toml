# Supabase local development configuration.
#
# project_id is the LOCAL stack identifier, not the production ref.
# Production is linked via `supabase link --project-ref <ref>`, and the ref is
# not committed here.
project_id = "hl-bos-platform"

[api]
enabled = true
port = 54321
# Only schemas listed here are exposed through PostgREST.
#
# This is a security control, not a convenience setting. The production
# database currently exposes helper functions as public RPC endpoints purely
# because their schema is API-exposed (see current-state-audit.md SEC-3).
# HL-BOS core schemas are deliberately NOT listed: identity.has_permission()
# and friends are called from RLS policies inside the database, and must not
# be reachable over HTTP.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match production: Postgres 17 (verified 17.6.1.127 on the live project).
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
# Local mail catcher. Ensures local dev cannot send real email.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
[analytics]
enabled = false

# ---------------------------------------------------------------------------
# Edge functions
#
# Every function keeps the default (verify_jwt = true) except `site`, which
# serves a shop's published page to the public. Requiring a JWT there would
# mean a website nobody can read without an account, which is not a website.
#
# What makes that safe is not this setting but what the function can reach: it
# calls two read-only RPCs with the ANON key, and those return published pages
# only (migration 0053). Nothing else in this repository is unauthenticated.
# ---------------------------------------------------------------------------
[functions.site]
verify_jwt = false
