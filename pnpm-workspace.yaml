# HL-BOS workspace definition.
#
# Packages are added to the tree only when they carry a real responsibility,
# a public interface, documentation and tests. Empty placeholder packages are
# explicitly not created -- an empty package that merely makes the repo "look
# complete" is a liability, not an asset.
#
# Phase 1 introduces exactly one package: @hl-bos/config.
# Later phases add packages as their capability lands.

packages:
  - "apps/*"
  - "packages/*"

# Centrally pinned versions, referenced from package.json via "catalog:".
# Rationale for the important pins is in docs/architecture/dependency-policy.md
# -- read it before bumping anything.
catalog:
  # --- Language / build ---------------------------------------------------
  # TypeScript is pinned to the 6.0 line, NOT latest (7.0.2).
  # typescript-eslint@8.64.0 declares `typescript: >=4.8.4 <6.1.0`.
  # TS 7 would silently break type-aware linting. See dependency-policy.md.
  typescript: "6.0.3"

  # --- Framework ----------------------------------------------------------
  next: "16.2.10"
  react: "19.2.7"
  react-dom: "19.2.7"
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.3"

  # --- Validation ---------------------------------------------------------
  zod: "4.4.3"

  # --- AI -----------------------------------------------------------------
  # Anthropic's official TypeScript SDK. Used ONLY behind the provider
  # abstraction in @hl-bos/ats-resume (src/provider), never called directly
  # from a page or a route handler, so a second AI vendor is a new file
  # rather than a rewrite. Server-side only: the API key is never exposed to
  # a browser bundle.
  "@anthropic-ai/sdk": "0.126.0"

  # --- Supabase -----------------------------------------------------------
  "@supabase/supabase-js": "2.117.2"
  "@supabase/ssr": "0.12.3"

  # --- Control Center -----------------------------------------------------
  # Import guard: makes a build FAIL if server-only code is pulled into a
  # client bundle. The Control Center shells out to git; that must never be
  # reachable from a browser bundle.
  server-only: "0.0.1"

  # --- JerseySort AI (apps/jersey-sort) -----------------------------------
  # sharp: thumbnails and previews. Prebuilt per-platform binaries arrive as
  #   optional dependencies, so no install script has to run.
  # exifr: reads photo date/camera EXIF without decoding pixels.
  # heic-convert: iPhone HEIC decode (libheif compiled to wasm). sharp's
  #   prebuilt libvips cannot decode HEVC-coded HEIC.
  # tesseract.js + @tesseract.js-data/eng: local OCR, the provider that works
  #   with no AI key. The language data ships in the package, so analysis
  #   never downloads anything at run time.
  # tailwindcss + @tailwindcss/postcss: the app's styling.
  sharp: "0.35.5"
  exifr: "7.1.3"
  heic-convert: "2.1.0"
  tesseract.js: "7.0.0"
  "@tesseract.js-data/eng": "1.0.0"
  tailwindcss: "4.3.3"
  "@tailwindcss/postcss": "4.3.3"

  # --- Test ---------------------------------------------------------------
  vitest: "4.1.10"
  "@vitest/coverage-v8": "4.1.10"

  # --- Node ---------------------------------------------------------------
  # Pinned to the 22 line to match engines.node (>=22) and the CI runtime.
  # Satisfies vitest's peer range (^20 || ^22 || >=24). Deliberately not 26
  # (latest): the @types major should track the Node runtime major, or you
  # get types for APIs that do not exist at runtime.
  "@types/node": "22.20.1"
