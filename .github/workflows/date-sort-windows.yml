name: DateSort on Windows

# Proves DateSort Step 1 (Scan and Report) on a real Windows machine, the
# way the CEO runs it:
#   - DateSort.bat itself is run (with no browser window and no keyboard),
#     and must set up, build, start and answer on port 4604
#   - Browse is pressed and the REAL Windows folder window is driven to
#     choose the test folder
#   - a camera-card-shaped folder (real Canon CR2/CR3 metadata, JPG, HEIC,
#     PNG, photos with no camera date, junk) and the photo folder Windows
#     itself ships (C:\Windows\Web) are scanned, with every file
#     fingerprinted before and after: any changed, renamed, deleted or added
#     file fails
#   - the desktop icons (DateSort and the Control Center) are made on the
#     first start, double-clicked, deleted, and must stay deleted
#   - then DateSort is stopped and started again from the Development
#     Control Center's Start DateSort button, and everything is checked again
#   - DateSort.bat collects new work from GitHub when it starts: a change
#     is put on a stand-in "GitHub" and DateSort.bat must fetch it, rebuild,
#     come up, and leave the console its rebuild note
#   - date -> sport -> jersey number: a game copied and named in DateSort,
#     "Find jersey numbers" starting JerseySort, the import link surviving
#     sign-up, and the game's photos arriving in a JerseySort event, with the
#     game folder unchanged (scripts/local-test/verify-date-to-jersey.cjs)
#   - Bring in from iPhone, through the same Windows Shell calls as a real
#     phone, against a folder laid out like an iPhone's DCIM
#   - DateSort's and the console's unit tests, on Windows

on:
  pull_request:
    paths:
      - "apps/date-sort/**"
      - "packages/date-sort/**"
      - "apps/control-center/**"
      - "scripts/DateSort.bat"
      - "scripts/date-sort.mjs"
      - "scripts/desktop-shortcut.mjs"
      - "scripts/jersey-sort.mjs"
      - "apps/jersey-sort/**"
      - "packages/jersey-sort/**"
      - "scripts/local-test/verify-date-to-jersey.cjs"
      - "scripts/update.mjs"
      - "scripts/control-center.bat"
      - "scripts/assets/**"
      - "scripts/local-test/verify-date-sort.cjs"
      - "scripts/local-test/pick-folder-in-dialog.ps1"
      - ".github/workflows/date-sort-windows.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "apps/date-sort/**"
      - "packages/date-sort/**"
      - "scripts/DateSort.bat"
      - "scripts/date-sort.mjs"
      - "scripts/desktop-shortcut.mjs"
      - "scripts/jersey-sort.mjs"
      - "apps/jersey-sort/**"
      - "packages/jersey-sort/**"
      - "scripts/local-test/verify-date-to-jersey.cjs"
      - "scripts/update.mjs"
      - "scripts/control-center.bat"
      - "scripts/assets/**"
      - "scripts/local-test/verify-date-sort.cjs"
      - "scripts/local-test/pick-folder-in-dialog.ps1"
      - ".github/workflows/date-sort-windows.yml"
  workflow_dispatch:

concurrency:
  group: date-sort-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # DateSort.bat and control-center.bat pin the same version.
  PNPM_VERSION: "10.34.5"

jobs:
  windows:
    name: DateSort on Windows (DateSort.bat, Browse, scan, console Start, tests)
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build tool, installed inside the repo (as DateSort.bat does it)
        run: |
          npm install "pnpm@$env:PNPM_VERSION" --prefix .hlbos\toolchain --no-save --no-fund --no-audit
          "PNPM_CJS=$PWD\.hlbos\toolchain\node_modules\pnpm\bin\pnpm.cjs" >> $env:GITHUB_ENV
          node --version

      - name: Libraries
        run: node $env:PNPM_CJS install --frozen-lockfile

      - name: Unit tests, on Windows
        run: |
          foreach ($p in "@hl-bos/date-sort", "@hl-bos/date-sort-app", "@hl-bos/control-center") {
            node $env:PNPM_CJS --filter $p test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build the console
        run: node $env:PNPM_CJS --filter @hl-bos/control-center build

      - name: Browser for the test
        run: |
          npm install -g playwright@1.56.1 --no-fund --no-audit
          npx -y playwright@1.56.1 install chromium

      - name: Double-click DateSort.bat, Browse, scan; then Start DateSort from the console
        # One step on purpose: on Windows runners every process a step starts
        # is ended with that step.
        env:
          DATESORT_NO_BROWSER: "1"
          DATESORT_REAL_FOLDERS: C:\Windows\Web
          # A folder laid out like an iPhone's DCIM, read through the same
          # Windows Shell calls as a real phone (no runner has an iPhone).
          DATESORT_IPHONE_TEST_SOURCE: ${{ runner.temp }}\fake-iphone\DCIM
        run: |
          $T = $env:RUNNER_TEMP
          function Up { try { (Invoke-WebRequest http://localhost:4604/api/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200 } catch { $false } }

          # A fresh runner has no DateSort icon; DateSort.bat must make it.
          $preIcon = Test-Path -LiteralPath (Join-Path ([Environment]::GetFolderPath('Desktop')) 'DateSort.lnk')
          "Icon before the first start: $preIcon"
          if ($preIcon) { Remove-Item -LiteralPath (Join-Path ([Environment]::GetFolderPath('Desktop')) 'DateSort.lnk') }
          Remove-Item -LiteralPath '.hlbos\desktop-shortcut.json' -ErrorAction SilentlyContinue
          # ...and no Control Center icon either; DateSort.bat makes that one too.
          Remove-Item -LiteralPath (Join-Path ([Environment]::GetFolderPath('Desktop')) 'HL-BOS Control Center.lnk') -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath '.hlbos\desktop-shortcut-control-center.json' -ErrorAction SilentlyContinue

          # --- 1. DateSort.bat, exactly as double-clicked (stdin from NUL so a
          #        "pause" on failure cannot hang the job) ---------------------
          $t0 = Get-Date
          $bat = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'scripts\DateSort.bat < NUL' `
            -RedirectStandardOutput "$T\datesort-bat.log" -RedirectStandardError "$T\datesort-bat.err.log" `
            -WindowStyle Hidden -PassThru
          $up = $false
          for ($i = 0; $i -lt 300; $i++) { if (Up) { $up = $true; break }; if ($bat.HasExited) { break }; Start-Sleep -Seconds 2 }
          $launch = [math]::Round(((Get-Date) - $t0).TotalSeconds)
          Get-Content "$T\datesort-bat.log", "$T\datesort-bat.err.log" -ErrorAction SilentlyContinue
          @{ ok = $up; seconds = $launch } | ConvertTo-Json | Set-Content "$T\bat-launch.json"
          if (-not $up) { "DateSort.bat did not bring DateSort up"; exit 1 }
          "DateSort.bat: DateSort is up after $launch s"

          $env:DATESORT_REPORT = "$T\run-bat.json"
          $env:DATESORT_SCREENSHOTS = "$T\shots-bat"
          node scripts/local-test/verify-date-sort.cjs http://127.0.0.1:4604
          $first = $LASTEXITCODE

          # --- 2. Stop it ----------------------------------------------------
          function Stop-DateSort {
            foreach ($c in Get-NetTCPConnection -LocalPort 4604 -State Listen -ErrorAction SilentlyContinue) { taskkill /T /F /PID $c.OwningProcess 2>$null | Out-Null }
            foreach ($p in Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*DateSort.bat*' }) { taskkill /T /F /PID $p.ProcessId 2>$null | Out-Null }
            for ($i = 0; $i -lt 30 -and (Up); $i++) { Start-Sleep -Seconds 1 }
            if (Up) { "DateSort did not stop"; exit 1 }
          }
          taskkill /T /F /PID $bat.Id | Out-Null
          Stop-DateSort

          # --- 3. The desktop icon ----------------------------------------------
          # DateSort.bat made it on its first start (scripts/desktop-shortcut.mjs).
          $desk = [Environment]::GetFolderPath('Desktop')
          $lnk = Join-Path $desk 'DateSort.lnk'
          $icon = @{ created = $false; target = $false; iconFile = $false; starts = $false; staysDeleted = $false; consoleMakes = $false }
          if (Test-Path -LiteralPath $lnk) {
            $icon.created = $true
            $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
            "Icon: $lnk -> $($sc.TargetPath) (icon $($sc.IconLocation), start in $($sc.WorkingDirectory))"
            $icon.target = $sc.TargetPath -ieq (Join-Path $PWD 'scripts\DateSort.bat')
            $icon.iconFile = $sc.IconLocation -ieq ((Join-Path $PWD 'scripts\assets\datesort.ico') + ',0')
          } else { "Icon: none on the desktop ($desk)" }

          # Double-click it: the shell opens the shortcut, as Explorer does.
          if ($icon.created) {
            $t1 = Get-Date
            Start-Process -FilePath $lnk
            for ($i = 0; $i -lt 90; $i++) { if (Up) { $icon.starts = $true; break }; Start-Sleep -Seconds 2 }
            "Icon: DateSort up after double-click: $($icon.starts) ($([math]::Round(((Get-Date) - $t1).TotalSeconds)) s)"
            Stop-DateSort
          }

          # Delete it: it must stay deleted on the next start.
          Remove-Item -LiteralPath $lnk -ErrorAction SilentlyContinue
          node scripts/desktop-shortcut.mjs
          $icon.staysDeleted = -not (Test-Path -LiteralPath $lnk)
          "Icon: stays deleted after the next start: $($icon.staysDeleted)"

          # --- 4. The Control Center icon --------------------------------------
          function ConsoleUp { try { Invoke-WebRequest http://localhost:4000 -UseBasicParsing -TimeoutSec 5 | Out-Null; $true } catch { $false } }
          function Stop-Console {
            foreach ($c in Get-NetTCPConnection -LocalPort 4000 -State Listen -ErrorAction SilentlyContinue) { taskkill /T /F /PID $c.OwningProcess 2>$null | Out-Null }
            foreach ($p in Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*control-center.bat*' }) { taskkill /T /F /PID $p.ProcessId 2>$null | Out-Null }
            for ($i = 0; $i -lt 30 -and (ConsoleUp); $i++) { Start-Sleep -Seconds 1 }
            if (ConsoleUp) { "The console did not stop"; exit 1 }
          }
          $ccLnk = Join-Path $desk 'HL-BOS Control Center.lnk'
          $cc = @{ created = $false; target = $false; iconFile = $false; starts = $false; staysDeleted = $false; consoleMakes = $false }
          if (Test-Path -LiteralPath $ccLnk) {
            $cc.created = $true
            $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($ccLnk)
            "Control Center icon: $ccLnk -> $($sc.TargetPath) (icon $($sc.IconLocation), start in $($sc.WorkingDirectory))"
            $cc.target = $sc.TargetPath -ieq (Join-Path $PWD 'scripts\control-center.bat')
            $cc.iconFile = $sc.IconLocation -ieq ((Join-Path $PWD 'scripts\assets\control-center.ico') + ',0')
          } else { "Control Center icon: none on the desktop ($desk)" }

          # Double-click it: control-center.bat must bring the console up.
          if ($cc.created) {
            $t2 = Get-Date
            Start-Process -FilePath $ccLnk
            for ($i = 0; $i -lt 150; $i++) { if (ConsoleUp) { $cc.starts = $true; break }; Start-Sleep -Seconds 2 }
            "Control Center icon: console up after double-click: $($cc.starts) ($([math]::Round(((Get-Date) - $t2).TotalSeconds)) s)"
            Stop-Console
          }

          Remove-Item -LiteralPath $ccLnk -ErrorAction SilentlyContinue
          node scripts/desktop-shortcut.mjs
          $cc.staysDeleted = -not (Test-Path -LiteralPath $ccLnk)
          "Control Center icon: stays deleted after the next start: $($cc.staysDeleted)"

          # A computer that has never had them: the Control Center makes both on start.
          Remove-Item -LiteralPath '.hlbos\desktop-shortcut.json' -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath '.hlbos\desktop-shortcut-control-center.json' -ErrorAction SilentlyContinue

          Start-Process -FilePath node `
            -ArgumentList $env:PNPM_CJS, "--filter", "@hl-bos/control-center", "start" `
            -RedirectStandardOutput "$T\console.log" -RedirectStandardError "$T\console.err.log" `
            -WindowStyle Hidden
          $cup = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { Invoke-WebRequest http://localhost:4000 -UseBasicParsing -TimeoutSec 5 | Out-Null; $cup = $true; break }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $cup) { Get-Content "$T\console.log", "$T\console.err.log" -ErrorAction SilentlyContinue; exit 1 }
          for ($i = 0; $i -lt 30 -and -not (Test-Path -LiteralPath $lnk); $i++) { Start-Sleep -Seconds 1 }
          $icon.consoleMakes = Test-Path -LiteralPath $lnk
          "Icon: made by the Control Center on start: $($icon.consoleMakes)"
          for ($i = 0; $i -lt 30 -and -not (Test-Path -LiteralPath $ccLnk); $i++) { Start-Sleep -Seconds 1 }
          $cc.consoleMakes = Test-Path -LiteralPath $ccLnk
          "Control Center icon: made by the Control Center on start: $($cc.consoleMakes)"
          $icon | ConvertTo-Json | Set-Content "$T\icon.json"
          $cc | ConvertTo-Json | Set-Content "$T\cc-icon.json"

          $env:DATESORT_REPORT = "$T\run-console.json"
          $env:DATESORT_SCREENSHOTS = "$T\shots-console"
          node scripts/local-test/verify-date-sort.cjs http://127.0.0.1:4604 --console http://localhost:4000
          $second = $LASTEXITCODE
          if ($first -ne 0) { exit $first }
          if ($second -ne 0) { exit $second }
          foreach ($k in 'created', 'target', 'iconFile', 'starts', 'staysDeleted', 'consoleMakes') {
            if (-not $icon[$k]) { "Desktop icon check failed: $k"; exit 1 }
            if (-not $cc[$k]) { "Control Center desktop icon check failed: $k"; exit 1 }
          }

      - name: Date, sport, then jersey numbers (DateSort hands a game to JerseySort)
        env:
          DATESORT_NO_BROWSER: "1"
        run: |
          $T = $env:RUNNER_TEMP
          function Up($port) { try { (Invoke-WebRequest "http://localhost:$port/api/health" -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200 } catch { $false } }
          $bat = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'scripts\DateSort.bat < NUL' `
            -RedirectStandardOutput "$T\datesort-jersey.log" -RedirectStandardError "$T\datesort-jersey.err.log" `
            -WindowStyle Hidden -PassThru
          for ($i = 0; $i -lt 300 -and -not (Up 4604); $i++) { if ($bat.HasExited) { break }; Start-Sleep -Seconds 2 }
          if (-not (Up 4604)) { Get-Content "$T\datesort-jersey.log", "$T\datesort-jersey.err.log" -ErrorAction SilentlyContinue; "DateSort did not start"; exit 1 }
          "JerseySort running before the button: $(Up 4603)"
          $env:DATESORT_REPORT = "$T\run-jersey.json"
          $env:DATESORT_SCREENSHOTS = "$T\shots-jersey"
          node scripts/local-test/verify-date-to-jersey.cjs http://127.0.0.1:4604
          $result = $LASTEXITCODE
          Get-Content (Join-Path $env:LOCALAPPDATA 'DateSort\jersey-sort.log') -Tail 40 -ErrorAction SilentlyContinue
          foreach ($port in 4604, 4603) {
            foreach ($c in Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) { taskkill /T /F /PID $c.OwningProcess 2>$null | Out-Null }
          }
          taskkill /T /F /PID $bat.Id 2>$null | Out-Null
          exit $result

      - name: DateSort.bat collects new work from GitHub when it starts
        # The checkout acts as its own stand-in GitHub: a change is committed
        # to a branch there, the folder is put one change behind it, and the
        # REAL DateSort.bat must collect it, rebuild and come up. (The real
        # GitHub is never pulled from here: that would test main, not this PR.)
        env:
          DATESORT_NO_BROWSER: "1"
        run: |
          $T = $env:RUNNER_TEMP
          function Up { try { (Invoke-WebRequest http://localhost:4604/api/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200 } catch { $false } }
          $r = @{ behind = $false; clean = $false; collected = $false; restarted = $false; rebuilt = $false; up = $false; atNewCode = $false; consoleNote = $false }

          git config user.name "DateSort CI"
          git config user.email "ci@localhost"
          git checkout -q -B ci-start
          Add-Content -LiteralPath apps\date-sort\README.md "`nProof line: collected from GitHub by DateSort.bat."
          git commit -qam "A change waiting on GitHub"
          git branch -f ci-github
          git reset -q --hard HEAD~1
          git remote set-url origin "$PWD"
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          git fetch -q origin
          git branch -q -u origin/ci-github
          $r.behind = (git rev-list --count HEAD..origin/ci-github) -eq "1"
          $dirty = git status --porcelain
          $r.clean = -not $dirty
          "Behind the stand-in GitHub by one change: $($r.behind). Folder clean: $($r.clean) $dirty"
          Remove-Item -LiteralPath '.hlbos\console-needs-rebuild' -ErrorAction SilentlyContinue
          $stamp = Get-Content -LiteralPath apps\date-sort\.next\datesort-source.sha256 -ErrorAction SilentlyContinue

          $bat = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'scripts\DateSort.bat < NUL' `
            -RedirectStandardOutput "$T\datesort-update.log" -RedirectStandardError "$T\datesort-update.err.log" `
            -WindowStyle Hidden -PassThru
          for ($i = 0; $i -lt 300; $i++) { if (Up) { $r.up = $true; break }; if ($bat.HasExited) { break }; Start-Sleep -Seconds 2 }
          $log = (Get-Content "$T\datesort-update.log", "$T\datesort-update.err.log" -ErrorAction SilentlyContinue) -join "`n"
          $log
          $r.collected = $log -match 'Collected 1 new change from GitHub'
          $r.restarted = $log -match 'Starting the new version'
          $r.rebuilt = ($log -match 'DateSort built') -and ((Get-Content -LiteralPath apps\date-sort\.next\datesort-source.sha256) -ne $stamp)
          $r.atNewCode = (git rev-parse HEAD) -eq (git rev-parse origin/ci-github)
          $r.consoleNote = Test-Path -LiteralPath '.hlbos\console-needs-rebuild'
          $r | ConvertTo-Json | Set-Content "$T\update.json"
          $r | Format-Table -AutoSize | Out-String

          foreach ($c in Get-NetTCPConnection -LocalPort 4604 -State Listen -ErrorAction SilentlyContinue) { taskkill /T /F /PID $c.OwningProcess 2>$null | Out-Null }
          taskkill /T /F /PID $bat.Id 2>$null | Out-Null
          foreach ($k in 'behind', 'clean', 'collected', 'restarted', 'rebuilt', 'up', 'atNewCode', 'consoleNote') {
            if (-not $r[$k]) { "Update check failed: $k"; exit 1 }
          }
          # Every check passed. Said explicitly: the runner otherwise reports the
          # exit code of the last program run, and taskkill above fails when
          # DateSort had already stopped with its parent.
          exit 0

      - name: Summary
        if: always()
        run: |
          $T = $env:RUNNER_TEMP
          function Load($f) { if (Test-Path $f) { Get-Content $f -Raw | ConvertFrom-Json } else { $null } }
          $launch = Load "$T\bat-launch.json"
          $a = Load "$T\run-bat.json"
          $b = Load "$T\run-console.json"
          $lines = @("## DateSort on Windows", "")
          if ($a) { $lines += "Platform: $($a.platform)", "" }
          $lines += "| Check | Result |", "| --- | --- |"
          $lines += "| DateSort Windows launch (DateSort.bat) | $(if ($launch -and $launch.ok) { "PASS ($($launch.seconds) s, first run: set-up + build)" } else { 'FAIL' }) |"
          $ic = Load "$T\icon.json"
          $yn = { param($v) if ($v) { 'PASS' } else { 'FAIL' } }
          if ($ic) {
            $lines += "| Desktop icon made on first start | $(& $yn $ic.created) |"
            $lines += "| Desktop icon opens DateSort.bat, with the DateSort icon | $(& $yn ($ic.target -and $ic.iconFile)) |"
            $lines += "| Double-clicking the icon starts DateSort | $(& $yn $ic.starts) |"
            $lines += "| A deleted icon stays deleted | $(& $yn $ic.staysDeleted) |"
            $lines += "| Control Center makes the icon on a new computer | $(& $yn $ic.consoleMakes) |"
          }
          $cci = Load "$T\cc-icon.json"
          if ($cci) {
            $lines += "| Control Center desktop icon made on first start | $(& $yn $cci.created) |"
            $lines += "| ...opens control-center.bat, with the Control Center icon | $(& $yn ($cci.target -and $cci.iconFile)) |"
            $lines += "| Double-clicking it starts the Control Center | $(& $yn $cci.starts) |"
            $lines += "| A deleted Control Center icon stays deleted | $(& $yn $cci.staysDeleted) |"
            $lines += "| The console makes its own icon on a new computer | $(& $yn $cci.consoleMakes) |"
          }
          $dj = Load "$T\run-jersey.json"
          if ($dj) {
            $lines += "| Date, sport, then jersey numbers (DateSort hands a game to JerseySort) | $(if ($dj.failures -eq 0) { "PASS ($($dj.checks) checks)" } else { "FAIL ($($dj.failures) of $($dj.checks))" }) |"
          }
          $up = Load "$T\update.json"
          if ($up) {
            $lines += "| Starting DateSort collects new work from GitHub | $(& $yn ($up.collected -and $up.restarted -and $up.atNewCode)) |"
            $lines += "| ...rebuilds with it and comes up | $(& $yn ($up.rebuilt -and $up.up)) |"
            $lines += "| ...and tells the Control Center to rebuild too | $(& $yn $up.consoleNote) |"
          }
          $console = if ($b) { $b.checklist.'Control Center Start button' } else { 'FAIL' }
          $lines += "| Control Center Start DateSort | $console |"
          $keys = "Folder Browse", "Include subfolders", "JPG/JPEG detection", "HEIC detection", "CR2 detection", "CR3 detection", "CR3 Date Taken reading", "Date grouping", "Estimated-date labeling", "Create folder (one date, with event name)", "Copy all dates", "Copies identical to originals", "Never overwrites", "Originals untouched by copying", "Destination remembered", "Name added after copying renames the folder", "Sport key handling", "Sport suggestions on the page", "Videos (iPhone MOV, MP4)", "Bring in from iPhone (same Windows calls, iPhone-like folder)"
          foreach ($k in $keys) {
            $va = if ($a) { $a.checklist.$k } else { $null }
            $vb = if ($b) { $b.checklist.$k } else { $null }
            $v = if ($va -eq 'PASS' -and $vb -eq 'PASS') { 'PASS' } elseif (-not $va -and -not $vb) { 'not run' } else { "FAIL (DateSort.bat run: $va, console run: $vb)" }
            $lines += "| $k | $v |"
          }
          $altered = 0; $printed = 0
          foreach ($r in @($a, $b)) { if ($r) { $altered += $r.sourceFilesAltered; $printed += $r.sourceFilesFingerprinted } }
          $lines += "| Source files altered | $altered (of $printed fingerprinted across every scan) |"
          foreach ($r in @($a, $b)) { if ($r) { $lines += "", "Run: $($r.checks - $r.failures) of $($r.checks) end-to-end checks passed" } }
          $lines -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: date-sort-windows
          path: |
            ${{ runner.temp }}\shots-bat
            ${{ runner.temp }}\shots-console
            ${{ runner.temp }}\shots-jersey
            ${{ runner.temp }}\*.json
            ${{ runner.temp }}\*.log
          if-no-files-found: ignore
