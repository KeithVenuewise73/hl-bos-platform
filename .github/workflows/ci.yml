name: CI
#
# Action pins: every action here runs on Node 24.
#
# GitHub switched the runner default to Node 24 on 2026-06-02 and removes
# Node 20 from runners entirely on 2026-09-16. Node 20 actions are living on
# borrowed time; gitleaks-action@v2 already fails outright. Runtimes verified
# from each action's own action.yml:
#
#   actions/checkout@v6      node24   (v4 = node20)
#   actions/setup-node@v5    node24   (v4 = node20)
#   pnpm/action-setup@v5     node24   (v4 = node20)
#   gitleaks/gitleaks-action@v3  node24   (v2 = node20, fails at init)
#
# Before adding an action, check `runs.using` in its action.yml. If it says
# node20, find the Node 24 major or expect it to break by 2026-09-16.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref -- no point burning minutes on a
# commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Jobs opt in to more if they ever need it.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the secret scan can diff the whole PR range,
          # not just the tip commit.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile: CI must never silently resolve a different tree
      # than the one that was reviewed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Owner decision: the TypeScript pin must not drift silently.
      # Runs before lint, because a pin outside ts-eslint's supported range
      # makes every type-aware lint result untrustworthy.
      - name: TypeScript pin compatibility
        run: bash scripts/check-typescript-pin.sh

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level permissions OVERRIDE the top-level block entirely, so both
    # scopes must be named here -- inheriting contents:read is not a thing.
    #
    # Why pull-requests: read is required, from the action's own source
    # (src/gitleaks.js, ScanPullRequest):
    #
    #   GET /repos/{owner}/{repo}/pulls/{pull_number}/commits
    #
    # The action needs commits.data[0].sha and the last sha to build the
    # scan range (--log-opts=<base>^..<head>). Without this scope the call
    # 403s and the job dies before scanning anything.
    #
    # This call is NOT avoidable on pull_request events. The BASE_REF env
    # override exists, but the source applies it AFTER the API call, so it
    # does not prevent the 403.
    #
    # pull-requests: WRITE is deliberately NOT granted. The only thing that
    # needs it is posting inline review comments on a detected secret, which
    # we disable below. Detection itself does not need it.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # v3, not v2. v2 runs on Node 20; GitHub switched the runner default to
      # Node 24 on 2026-06-02 and v2's bundle fails at initialization on it --
      # before scanning anything. v3 is the same action on Node 24; the vendor
      # documents it as a one-line migration with no input/output/behaviour
      # change. Node 20 is removed from runners entirely on 2026-09-16.
      #
      # GITLEAKS_LICENSE is intentionally absent: it is required only for repos
      # owned by a GitHub *organization*. This repo is under a personal account
      # (KeithVenuewise73), so scanning is free. NOTE: if this repo is ever
      # transferred to a GitHub organization, this step will start failing until
      # a free license key from gitleaks.io is added as a repo secret.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Off so the job can run on pull-requests:read instead of :write.
          # createReviewComment() is the ONLY call needing write, and the
          # source wraps it in try/catch -- so with read-only it would fail
          # silently on every leak forever. Better to disable it explicitly
          # than to leave a permanently broken code path.
          #
          # This does NOT weaken detection. On a leak, gitleaks still exits 2,
          # the action exits 1, the job goes red and the PR stays blocked. The
          # findings are still reported in the job summary and the SARIF
          # artifact. Only the inline PR comment is lost.
          #
          # To get inline comments back: delete this line and change
          # pull-requests: read -> write above. That is the whole trade.
          GITLEAKS_ENABLE_COMMENTS: "false"

      # Defence in depth: gitleaks catches known credential shapes, this
      # catches the specific mistake this platform most fears -- a private
      # secret behind a browser-visible NEXT_PUBLIC_ prefix.
      - name: Reject NEXT_PUBLIC_ secrets
        run: bash scripts/check-no-public-secrets.sh

  database-tests:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # no PR API access needed
    steps:
      - uses: actions/checkout@v6

      # Composite action -- verified from its action.yml, so no Node 20 runtime
      # exposure (unlike the gitleaks v2 problem).
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The real local Supabase stack. A bare postgres:17 service container has
      # no auth.uid() and no anon/authenticated/service_role roles, so RLS tests
      # against it would pass while proving nothing.
      - name: Start Supabase
        run: supabase start

      # Proves the set applies cleanly from an empty database, in order.
      # This is what catches ordering breakage and non-idempotent DDL.
      - name: Apply migrations from scratch
        run: supabase db reset

      - name: pgTAP suite
        run: supabase test db

      # plpgsql_check. Gated at `error`, not `warning`: warnings are advisory
      # (unused variables, hidden casts) and a cosmetic one turning the PR red
      # is a false signal that trains people to ignore the gate. Errors are
      # real: wrong types, missing RETURN, dead code, SQL-injection patterns.
      - name: Database lint (errors fail the build)
        run: supabase db lint --level error

      # Warnings surface in the log without blocking the merge.
      - name: Database lint (warnings, advisory)
        continue-on-error: true
        run: supabase db lint --level warning

      - name: Stop Supabase
        if: always()
        run: supabase stop

  migrations:
    name: Migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate migration filenames and content
        run: bash scripts/check-migrations.sh

  functions-tests:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deno unit tests for the AI-gateway edge layer (provider adapters, secret
    # redaction, structured-output validation, retry). Deno is installed via its
    # official script rather than a third-party action, to avoid any action
    # Node-runtime pinning concern. The tests import only local _shared modules
    # (no remote deps), so they run offline once Deno is present.
    steps:
      - uses: actions/checkout@v6
      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$HOME/.deno" sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Run edge function unit tests
        run: deno test --no-check supabase/functions/tests/
