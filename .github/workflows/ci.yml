name: CI
#
# Action pins: every action here runs on Node 24.
#
# GitHub switched the runner default to Node 24 on 2026-06-02 and removes
# Node 20 from runners entirely on 2026-09-16. Node 20 actions are living on
# borrowed time; gitleaks-action@v2 already fails outright. Runtimes verified
# from each action's own action.yml:
#
#   actions/checkout@v6      node24   (v4 = node20)
#   actions/setup-node@v5    node24   (v4 = node20)
#   pnpm/action-setup@v5     node24   (v4 = node20)
#   gitleaks/gitleaks-action@v3  node24   (v2 = node20, fails at init)
#
# Before adding an action, check `runs.using` in its action.yml. If it says
# node20, find the Node 24 major or expect it to break by 2026-09-16.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref -- no point burning minutes on a
# commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Jobs opt in to more if they ever need it.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the secret scan can diff the whole PR range,
          # not just the tip commit.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile: CI must never silently resolve a different tree
      # than the one that was reviewed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Owner decision: the TypeScript pin must not drift silently.
      # Runs before lint, because a pin outside ts-eslint's supported range
      # makes every type-aware lint result untrustworthy.
      - name: TypeScript pin compatibility
        run: bash scripts/check-typescript-pin.sh

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # v3, not v2. v2 runs on Node 20; GitHub switched the runner default to
      # Node 24 on 2026-06-02 and v2's bundle fails at initialization on it --
      # before scanning anything. v3 is the same action on Node 24; the vendor
      # documents it as a one-line migration with no input/output/behaviour
      # change. Node 20 is removed from runners entirely on 2026-09-16.
      #
      # GITLEAKS_LICENSE is intentionally absent: it is required only for repos
      # owned by a GitHub *organization*. This repo is under a personal account
      # (KeithVenuewise73), so scanning is free. NOTE: if this repo is ever
      # transferred to a GitHub organization, this step will start failing until
      # a free license key from gitleaks.io is added as a repo secret.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Defence in depth: gitleaks catches known credential shapes, this
      # catches the specific mistake this platform most fears -- a private
      # secret behind a browser-visible NEXT_PUBLIC_ prefix.
      - name: Reject NEXT_PUBLIC_ secrets
        run: bash scripts/check-no-public-secrets.sh

  migrations:
    name: Migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate migration filenames and content
        run: bash scripts/check-migrations.sh
